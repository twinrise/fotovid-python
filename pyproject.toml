[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fotovid"
dynamic = ["version"]
description = "Typed Python SDK for the Fotovid serverless ffmpeg API — video watermarking, trim, thumbnails, audio extraction, probe"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fotovid" }]
keywords = [
  "fotovid",
  "ffmpeg",
  "ffmpeg-api",
  "watermark",
  "video",
  "image",
  "audio",
  "trim",
  "thumbnail",
  "probe",
  "media",
  "serverless",
  "async",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://fotovid.co"
Repository = "https://github.com/twinrise/fotovid-python"
Issues = "https://github.com/twinrise/fotovid-python/issues"

[tool.hatch.version]
path = "src/fotovid/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fotovid"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
