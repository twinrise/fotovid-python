name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) when a v* tag is pushed.
# No API token needed — configure the trusted publisher on PyPI first:
# https://pypi.org/manage/project/fotovid/settings/publishing/
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
